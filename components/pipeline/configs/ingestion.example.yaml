bill_limit: null
dev:
  snapshot_path: data/dev_snapshots/bills_ingested_sample.parquet
ilga_ftp:
  chunk_size: 25
  max_sleep_seconds: 0.7
  min_sleep_seconds: 0.3
  retries: 3
  timeout_seconds: 30
ilga_ftp_fallback:
  enabled: true
  min_text_len: 500
  pick: newest
  sleep_seconds: 0.5
  timeout_seconds: 30
legiscan:
  api_key_env: LEGISCAN_API_KEY
  dataset_timeout_seconds: 300
  retries: 3
  state: IL
  timeout_seconds: 60
mode: live
sessions:
- 2176
terminal_status_codes:
- 3
- 4
- 5
- 6
tmp_dir: storage/temp/ingestion
write_bills_with_no_text: true
